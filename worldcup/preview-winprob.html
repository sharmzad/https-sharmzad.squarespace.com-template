<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Win-probability bar — preview</title>
<style>
  :root{--bg:#0b1d12;--card:#16301f;--card2:#1c3a26;--line:#2a4d35;--text:#eef7f0;
    --muted:#9db8a6;--gold:#f4c542;--green:#35d07f;--red:#ff6b6b;--cyan:#19b6e6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:16px;max-width:640px;margin:0 auto;}
  .ptag{background:var(--cyan);color:#04222e;font-size:11px;font-weight:800;letter-spacing:1px;
    text-align:center;padding:5px;border-radius:8px;margin-bottom:14px;}
  .match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;}
  .match-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#103a26;color:var(--green);}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
  .team{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
  .flag{font-size:30px;}
  .team b{font-size:13.5px;}
  .fifa{font-size:10px;color:var(--muted);font-weight:700;}
  .center{text-align:center;min-width:86px;}
  .ko{font-size:17px;font-weight:700;}.kos{font-size:11px;color:var(--muted);}
  /* win-probability bar */
  .wp{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);}
  .wp-h{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;margin-bottom:7px;}
  .wp-bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#33503e;}
  .wp-bar i{display:block;height:100%;}
  .wp-bar .h{background:var(--green);}
  .wp-bar .d{background:#5b7384;}
  .wp-bar .a{background:var(--cyan);}
  .wp-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px;}
  .wp-legend b{color:var(--text);}
  .legend{margin-top:8px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    font-size:12.5px;color:var(--muted);line-height:1.7;}
  .legend b{color:var(--text);}
</style>
</head>
<body>
  <div class="ptag">PREVIEW — not live yet</div>
  <div id="list"></div>
  <div class="legend">
    <b>How it reads:</b> 🟢 left = first team win · ⚪ middle = draw · 🔵 right = second team win.
    Live version uses <b>ESPN's real pre-match prediction</b> when available, and falls back to this
    FIFA-rank estimate when it isn't — shown only on upcoming matches, as a pre-bet hint.
  </div>

<script>
  // FIFA-rank → win/draw/loss estimate (the fallback model)
  function ratingFromRank(r){ return 1900 - 7.2 * r; }
  function winProb(rh, ra){
    const eh = 1 / (1 + Math.pow(10, (ratingFromRank(ra) - ratingFromRank(rh)) / 400));
    let draw = 0.27 * (1 - Math.abs(2*eh - 1) * 0.85);
    let home = eh - draw/2, away = (1 - eh) - draw/2;
    home = Math.max(home, .02); away = Math.max(away, .02);
    const s = home + draw + away;
    return { home: home/s*100, draw: draw/s*100, away: away/s*100 };
  }
  const fixtures = [
    {flag1:"🇦🇷",t1:"Argentina",r1:1,flag2:"🇩🇿",t2:"Algeria",r2:28,ko:"04:00",grp:"Group J"},
    {flag1:"🇪🇸",t1:"Spain",r1:2,flag2:"🇸🇦",t2:"Saudi Arabia",r2:61,ko:"18:00",grp:"Group H"},
    {flag1:"🇪🇬",t1:"Egypt",r1:29,flag2:"🇮🇷",t2:"IR Iran",r2:21,ko:"23:00",grp:"Group G"},
    {flag1:"🇺🇸",t1:"USA",r1:16,flag2:"🇦🇺",t2:"Australia",r2:27,ko:"21:00",grp:"Group D"},
    {flag1:"🇳🇴",t1:"Norway",r1:31,flag2:"🇫🇷",t2:"France",r2:3,ko:"21:00",grp:"Group I"},
  ];
  const abbr = s => s.slice(0,3).toUpperCase();
  document.getElementById("list").innerHTML = fixtures.map(f=>{
    const p = winProb(f.r1, f.r2);
    const R = x => Math.round(x);
    return `<div class="match">
      <div class="match-top"><span>${f.grp}</span><span class="badge">OPEN</span></div>
      <div class="teams">
        <div class="team"><div class="flag">${f.flag1}</div><b>${f.t1}</b><span class="fifa">#${f.r1}</span></div>
        <div class="center"><div class="ko">${f.ko}</div><div class="kos">kickoff</div></div>
        <div class="team"><div class="flag">${f.flag2}</div><b>${f.t2}</b><span class="fifa">#${f.r2}</span></div>
      </div>
      <div class="wp">
        <div class="wp-h">🔮 Win prediction</div>
        <div class="wp-bar"><i class="h" style="width:${p.home}%"></i><i class="d" style="width:${p.draw}%"></i><i class="a" style="width:${p.away}%"></i></div>
        <div class="wp-legend">
          <span><b>${abbr(f.t1)}</b> ${R(p.home)}%</span>
          <span>Draw ${R(p.draw)}%</span>
          <span>${R(p.away)}% <b>${abbr(f.t2)}</b></span>
        </div>
      </div>
    </div>`;
  }).join("");
</script>
</body>
</html>
