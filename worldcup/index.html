<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d12">
  <title>El 3eshّa World Cup 26 ⚽🏆 — Prediction Game</title>
  <meta name="description" content="El 3eshّa World Cup 26 — private World Cup 2026 prediction game for the gang. Predict scores, climb the leaderboard, win bragging rights.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="group.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css?v=54">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon"><img src="group.jpg" alt="" onerror="this.parentElement.textContent='🏆'"></span>
      <div>
        <h1>El 3eshّa WC 26 ⚽</h1>
        <p class="tagline">World Cup 2026 prediction battle</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="bellBtn" class="bell-btn" title="Notifications">🔔</button>
      <button id="playerChip" class="player-chip" title="Player">👤 Join</button>
    </div>
  </header>

  <div id="adminHealth" class="admin-health hidden"></div>
  <div id="banner" class="banner hidden"></div>

  <main id="view"></main>

  <div class="bottom-dock">
    <a id="sponsorStrip" class="sponsor-strip hidden" target="_blank" rel="noopener"></a>
    <nav class="tabbar">
      <button class="tab active" data-tab="matches">⚽<span>Matches</span></button>
      <button class="tab" data-tab="table">🏅<span>Table</span></button>
      <button class="tab" data-tab="share">🌍<span>Groups</span></button>
      <button class="tab" data-tab="rules">📜<span>Rules</span></button>
    </nav>
  </div>

  <!-- Sponsor motion intro (plays on app open) -->
  <div id="sponsorIntro" class="intro hidden">
    <div class="intro-glow"></div>
    <div class="intro-inner">
      <div class="intro-brand">El 3eshّa World Cup 26 ⚽</div>
      <div class="intro-present">proudly sponsored by</div>
      <div class="intro-stage">
        <img id="introLogo" class="intro-logo hidden" alt="">
        <div id="introWordmark" class="intro-wordmark"></div>
      </div>
      <div id="introTagline" class="intro-tagline"></div>
      <div class="intro-road">
        <div class="intro-car">
          <svg viewBox="0 0 72 30" width="50" height="21" aria-hidden="true">
            <path class="car-body" d="M3 21 q1.5 -7.5 10 -8.5 l7 -0.3 q3 -5.2 9.5 -5.2 l11 0 q6.5 0 11.5 6.2 l9 2 q5 1 5 5.8 q0 2 -2.2 2 l-58 0 q-3.2 0 -3.1 -4 z"/>
            <path class="car-glass" d="M23 11.5 q2 -3.4 7.5 -3.4 l9 0 q4.5 0 8.5 4.2 l-25 0 z"/>
            <circle class="car-wheel" cx="21" cy="23" r="5"/>
            <circle class="car-wheel" cx="51" cy="23" r="5"/>
          </svg>
        </div>
      </div>
      <div class="intro-bar"><i></i></div>
    </div>
    <button id="introSkip" class="intro-skip">Skip ›</button>
  </div>

  <!-- One-time fireworks announcement -->
  <div id="announce" class="announce hidden">
    <canvas id="fireworks"></canvas>
    <div class="announce-card">
      <div class="announce-emoji" id="announceEmoji">🎯🎆</div>
      <h2 id="announceTitle"></h2>
      <p id="announceBody"></p>
      <button id="announceClose" class="btn primary">🎉 Let's go</button>
    </div>
  </div>

  <!-- Join / login modal -->
  <div id="joinModal" class="modal hidden">
    <div class="modal-card">
      <h2>Join El 3eshّa World Cup 26 🎉</h2>
      <label>Group code
        <input id="joinCode" type="text" placeholder="Ask the group admin" autocomplete="off">
      </label>
      <label>Your name
        <input id="joinName" type="text" maxlength="14" placeholder="e.g. Foad" autocomplete="off">
      </label>
      <label>PIN (4 digits, to protect your picks)
        <input id="joinPin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
      </label>
      <label>Pick your avatar</label>
      <div id="emojiRow" class="emoji-row"></div>
      <p id="joinError" class="error hidden"></p>
      <div class="modal-actions">
        <button id="joinCancel" class="btn ghost">Cancel</button>
        <button id="joinSubmit" class="btn primary">Let's go ⚽</button>
      </div>
      <p class="hint">Already joined? Enter the same name + PIN to log back in. Works on any device.</p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- "What's New" notification pop-up (slides in after launch) -->
  <div id="whatsnew" class="whatsnew hidden">
    <div class="wn-card">
      <div class="wn-icon" id="wnIcon">🆕</div>
      <div class="wn-text">
        <div class="wn-title" id="wnTitle">What's New</div>
        <div class="wn-body" id="wnBody"></div>
      </div>
      <button class="wn-close" id="wnClose" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <!-- Admin analytics dashboard (Alaa only) -->
  <div id="dashModal" class="modal hidden">
    <div class="modal-card">
      <h2>📊 Game analytics</h2>
      <div id="dashBody" class="dash-grid"></div>
      <div class="modal-actions">
        <button id="dashClose" class="btn primary">Close</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js?v=54"></script>
  <script type="module" src="js/app.js?v=54"></script>
</body>
</html>
