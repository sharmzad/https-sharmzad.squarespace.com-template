<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Standings redesign — preview</title>
<style>
  :root{
    --bg:#0b1d12;--card:#16301f;--card2:#1c3a26;--line:#2a4d35;--text:#eef7f0;
    --muted:#9db8a6;--gold:#f4c542;--green:#35d07f;--red:#ff6b6b;--cyan:#19b6e6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:16px;max-width:640px;margin:0 auto;}
  .preview-tag{background:var(--cyan);color:#04222e;font-size:11px;font-weight:800;
    letter-spacing:1px;text-align:center;padding:5px;border-radius:8px;margin-bottom:14px;}
  h1{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);
    margin:6px 2px 12px;}

  /* ---- new standings rows ---- */
  .row{display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;
    position:relative;overflow:hidden;}
  .row.me{border-color:transparent;background:
    linear-gradient(100deg,rgba(25,182,230,.20),rgba(53,208,127,.18) 55%,rgba(244,197,66,.12));}
  .row.me::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--cyan),var(--green));}

  .rank{width:24px;text-align:center;font-weight:800;font-size:16px;flex:none;}
  .rank.r1{color:var(--gold);} .rank.r2{color:#cdd6dd;} .rank.r3{color:#e08b4b;}

  .move{width:16px;flex:none;font-size:11px;text-align:center;font-weight:800;}
  .move.up{color:var(--green);} .move.down{color:var(--red);} .move.same{color:var(--muted);}

  .av{width:38px;height:38px;flex:none;border-radius:50%;background:var(--card2);
    display:flex;align-items:center;justify-content:center;font-size:20px;
    border:1px solid var(--line);}
  .row.me .av{border-color:var(--cyan);}

  .meta{flex:1;min-width:0;}
  .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;}
  .you{background:var(--cyan);color:#04222e;font-size:9px;font-weight:800;
    padding:1px 6px;border-radius:999px;letter-spacing:.5px;}
  .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;}
  .form{display:flex;gap:3px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#33503e;}
  .dot.ex{background:var(--gold);box-shadow:0 0 5px var(--gold);}
  .dot.win{background:var(--green);}

  .pts{flex:none;text-align:right;}
  .pts b{font-size:20px;font-weight:800;color:var(--gold);line-height:1;}
  .pts span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

  .legend{margin-top:18px;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;font-size:12.5px;color:var(--muted);line-height:1.7;}
  .legend b{color:var(--text);}
</style>
</head>
<body>
  <div class="preview-tag">PREVIEW — your live Table tab is unchanged</div>
  <h1>🏅 Gang standings</h1>
  <div id="list"></div>

  <div class="legend">
    <b>Legend:</b> ▲/▼ = moved up/down since the last finished match · 🟡 = exact score (+7) ·
    🟢 = a win · ⚪ = no points · the highlighted row + <span class="you" style="vertical-align:middle">YOU</span> is the logged-in player.
  </div>

<script>
  // sample = your current real standings, with mock movement + form to show the look
  const rows = [
    {emoji:"🦌",name:"Abdelhameed",played:16,exact:0,pts:16,move:"same",form:["win","win",""]},
    {emoji:"🐯",name:"Walid Ali",played:16,exact:1,pts:15,move:"up",form:["ex","win","win"]},
    {emoji:"🦈",name:"Alaa",played:17,exact:0,pts:12,move:"up",me:true,form:["win","","win"]},
    {emoji:"🦫",name:"Abo alaa",played:10,exact:0,pts:12,move:"down",form:["win","win",""]},
    {emoji:"🐴",name:"Ahmed hassan",played:13,exact:0,pts:12,move:"same",form:["","win","win"]},
    {emoji:"🐕",name:"Yasser",played:10,exact:0,pts:12,move:"up",form:["win","",""]},
    {emoji:"🐬",name:"Ayman",played:2,exact:1,pts:11,move:"up",form:["ex","",""]},
    {emoji:"🐴",name:"Mimi",played:3,exact:1,pts:11,move:"down",form:["ex","","win"]},
    {emoji:"🏃",name:"ABDELRAHMEN",played:3,exact:0,pts:4,move:"same",form:["win","",""]},
    {emoji:"🦊",name:"Zeina Hesham",played:5,exact:0,pts:4,move:"down",form:["","win",""]},
    {emoji:"🦁",name:"Zoro",played:0,exact:0,pts:2,move:"same",form:["","",""]},
  ];
  const moveGlyph={up:"▲",down:"▼",same:"–"};
  document.getElementById("list").innerHTML = rows.map((r,i)=>{
    const rank=i+1;
    const rcls = rank<=3 ? ` r${rank}` : "";
    const medal = ["🥇","🥈","🥉"][i] || rank;
    const dots = r.form.map(f=>`<span class="dot ${f}"></span>`).join("");
    return `<div class="row ${r.me?'me':''}">
      <div class="rank${rcls}">${medal}</div>
      <div class="move ${r.move}">${moveGlyph[r.move]}</div>
      <div class="av">${r.emoji}</div>
      <div class="meta">
        <div class="name">${r.name}${r.me?'<span class="you">YOU</span>':''}</div>
        <div class="sub">Played ${r.played} · 🎯 ${r.exact} exact <span class="form">${dots}</span></div>
      </div>
      <div class="pts"><b>${r.pts}</b><span>pts</span></div>
    </div>`;
  }).join("");
</script>
</body>
</html>
