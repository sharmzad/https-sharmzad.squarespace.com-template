name: Match notifications

on:
  schedule:
    - cron: "*/5 * * * *" # backup only — GitHub delays these heavily; primary trigger is cron-job.org → workflow_dispatch
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@^12
      - name: Send pending notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/notify.js
