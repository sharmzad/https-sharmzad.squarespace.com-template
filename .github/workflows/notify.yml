name: Match notifications

on:
  # Sole trigger is cron-job.org calling the workflow_dispatch API every ~5 min.
  # (The old GitHub `schedule: */5` ran in parallel and collided with cron-job.org
  # every cycle, so one run was cancelled each time → a flood of "cancelled"
  # emails. Removed. Manual runs still work via the Actions tab / API.)
  workflow_dispatch: {}

permissions: {}

# Serialise runs so overlapping triggers never double-send live goal alerts.
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@^12
      - name: Send pending notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/notify.js
