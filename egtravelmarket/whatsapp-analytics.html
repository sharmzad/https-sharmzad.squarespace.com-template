<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Analytics Dashboard | Eg Travel Market</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
      color: #333;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .header h1 {
      color: #667eea;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    
    .header p {
      color: #666;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: white;
      padding: 1.5rem;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
    }
    
    .stat-card h3 {
      color: #666;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stat-card .number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #667eea;
    }
    
    .stat-card .icon {
      font-size: 2rem;
      color: #25D366;
      margin-bottom: 0.5rem;
    }
    
    .data-section {
      background: white;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 2rem;
    }
    
    .data-section h2 {
      color: #667eea;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .service-stats {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .service-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #25D366;
    }
    
    .service-item .name {
      font-weight: 600;
      color: #333;
    }
    
    .service-item .count {
      font-size: 1.5rem;
      font-weight: 700;
      color: #667eea;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    table th {
      background: #667eea;
      color: white;
      padding: 1rem;
      text-align: left;
      font-weight: 600;
    }
    
    table td {
      padding: 1rem;
      border-bottom: 1px solid #e0e0e0;
    }
    
    table tr:hover {
      background: #f8f9fa;
    }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    
    .badge.medical {
      background: #e3f2fd;
      color: #1976d2;
    }
    
    .badge.book-diving {
      background: #e0f2f1;
      color: #00796b;
    }
    
    .badge.homepage-advisors {
      background: #fff3e0;
      color: #e65100;
    }
    
    .loading {
      text-align: center;
      padding: 3rem;
      color: #666;
    }
    
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      
      .header h1 {
        font-size: 1.5rem;
      }
      
      table {
        font-size: 0.85rem;
      }
      
      table th, table td {
        padding: 0.5rem;
      }
    }
  </style>

<body>
  <div class="container">
    <div class="header">
      <h1>
        <i class="fab fa-whatsapp"></i>
        WhatsApp Analytics Dashboard
      </h1>
      <p>Track customer engagement with WhatsApp contact buttons</p>
    </div>
    
    <div id="errorMessage" class="error" style="display: none;"></div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="icon"><i class="fas fa-mouse-pointer"></i></div>
        <h3>Total Clicks</h3>
        <div class="number" id="totalClicks">-</div>
      </div>
      
      <div class="stat-card">
        <div class="icon"><i class="fas fa-clinic-medical"></i></div>
        <h3>Medical Page</h3>
        <div class="number" id="medicalClicks">-</div>
      </div>
      
      <div class="stat-card">
        <div class="icon"><i class="fas fa-water"></i></div>
        <h3>Diving Bookings</h3>
        <div class="number" id="divingClicks">-</div>
      </div>
      
      <div class="stat-card">
        <div class="icon"><i class="fas fa-users"></i></div>
        <h3>Board Advisors</h3>
        <div class="number" id="advisorsClicks">-</div>
      </div>
    </div>
    
    <div class="data-section">
      <h2><i class="fas fa-list"></i> Clicks by Service</h2>
      <div class="service-stats" id="serviceStats">
        <div class="loading">Loading service statistics...</div>
      </div>
    </div>
    
    <div class="data-section">
      <h2><i class="fas fa-history"></i> Recent Clicks (Last 50)</h2>
      <div style="overflow-x: auto;">
        <table id="recentClicksTable">
          <thead>
            <tr>
              <th>Time</th>
              <th>Service</th>
              <th>Page</th>
              <th>WhatsApp Number</th>
            </tr>
          </thead>
          <tbody id="recentClicks">
            <tr>
              <td colspan="4" class="loading">Loading recent clicks...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadAnalytics() {
      try {
        const response = await fetch('/api/whatsapp/stats');
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        document.getElementById('totalClicks').textContent = data.totalClicks || 0;
        document.getElementById('medicalClicks').textContent = data.byPage?.medical || 0;
        document.getElementById('divingClicks').textContent = data.byPage?.['book-diving'] || 0;
        document.getElementById('advisorsClicks').textContent = data.byPage?.['homepage-advisors'] || 0;
        
        const serviceStatsContainer = document.getElementById('serviceStats');
        if (Object.keys(data.byService || {}).length > 0) {
          serviceStatsContainer.innerHTML = '';
          Object.entries(data.byService).forEach(([service, count]) => {
            const div = document.createElement('div');
            div.className = 'service-item';
            div.innerHTML = `
              <span class="name">${service}</span>
              <span class="count">${count}</span>
            `;
            serviceStatsContainer.appendChild(div);
          });
        } else {
          serviceStatsContainer.innerHTML = '<div class="loading">No clicks recorded yet</div>';
        }
        
        const recentClicksBody = document.getElementById('recentClicks');
        if (data.recent && data.recent.length > 0) {
          recentClicksBody.innerHTML = '';
          data.recent.forEach(click => {
            const row = document.createElement('tr');
            const date = new Date(click.createdAt);
            let badgeClass = 'book-diving';
            if (click.pageSource === 'medical') badgeClass = 'medical';
            else if (click.pageSource === 'homepage-advisors') badgeClass = 'homepage-advisors';
            
            row.innerHTML = `
              <td>${date.toLocaleString()}</td>
              <td>${click.serviceName}</td>
              <td><span class="badge ${badgeClass}">${click.pageSource}</span></td>
              <td>+${click.whatsappNumber}</td>
            `;
            recentClicksBody.appendChild(row);
          });
        } else {
          recentClicksBody.innerHTML = '<tr><td colspan="4" class="loading">No clicks recorded yet</td></tr>';
        }
        
      } catch (error) {
        console.error('Error loading analytics:', error);
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = 'Error loading analytics data: ' + error.message;
        errorDiv.style.display = 'block';
      }
    }
    
    loadAnalytics();
    
    setInterval(loadAnalytics, 30000);
  </script>
<script src="/js/meta-pixel-events.js"></script>
</body>
</html>
